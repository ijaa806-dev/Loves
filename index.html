
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Special Question ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.card {
    background: white;
    padding: 40px 25px;
    border-radius: 25px;
    text-align: center;
    width: 90%;
    max-width: 420px;
    box-shadow: 0 10px 40px #0003;
}

.heart {
    font-size: 65px;
    animation: beat 1s infinite;
}

@keyframes beat {
    50% { transform: scale(1.2); }
}

h1 {
    color: #ff4081;
    margin: 15px 0;
}

p {
    color: #555;
    font-size: 17px;
    margin: 15px 0 25px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
}

button {
    padding: 13px 28px;
    border: none;
    border-radius: 30px;
    font-size: 17px;
    cursor: pointer;
    font-weight: bold;
}

#yes {
    background: #ff4081;
    color: white;
}

#no {
    background: #555;
    color: white;
}

#message {
    color: #ff4081;
    font-weight: bold;
    margin-top: 20px;
}

#success {
    display: none;
}

</style>
</head>

<body>

<div class="card" id="main">

    <div class="heart">❤️</div>

    <h1>Hey Beautiful! 🥰</h1>

    <p>
        I have a very important question for you...
        <br><br>
        Will you be mine forever? 💍
    </p>

    <div class="buttons">
        <button id="yes" onclick="accepted()">YES 😍</button>
        <button id="no" onclick="rejected()">NO 😜</button>
    </div>

    <div id="message"></div>

</div>

<div class="card" id="success">

    <div class="heart">💖</div>

    <h1>YAYYYYY! 😍</h1>

    <p>
        I knew it! 😂❤️
        <br><br>
        You just made my world more beautiful!
        <br><br>
        Love youuu! 🥰
    </p>

    <h2>💑 Forever Together 💍</h2>

</div>

<script>

function accepted() {
    document.getElementById("main").style.display = "none";
    document.getElementById("success").style.display = "block";
}

function rejected() {
    document.getElementById("message").innerHTML =
    "KLI YES PR DBA SUGLII 😂❤️";

    let no = document.getElementById("no");

    no.innerHTML = "NO? 🤨";

    setTimeout(() => {
        no.innerHTML = "NO 😜";
    }, 1200);
}



function accepted() {
    document.getElementById("main").style.display = "none";
    document.getElementById("success").style.display = "block";
}

const no = document.getElementById("no");

function runAway() {
    no.style.position = "fixed";

    const maxX = window.innerWidth - no.offsetWidth - 20;
    const maxY = window.innerHeight - no.offsetHeight - 20;

    const x = Math.random() * Math.max(0, maxX);
    const y = Math.random() * Math.max(0, maxY);

    no.style.left = x + "px";
    no.style.top = y + "px";

    document.getElementById("message").innerHTML =
        "Oyeee! NO nahi chalega 😂❤️";
}

// Desktop
no.addEventListener("mouseenter", runAway);

// Mobile
no.addEventListener("touchstart", function(e) {
    e.preventDefault();
    runAway();
});

// Click fallback
no.addEventListener("click", function(e) {
    e.preventDefault();
    runAway();
});


</script>

</body>
</html>
